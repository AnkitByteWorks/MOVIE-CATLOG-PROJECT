version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend/user-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: "maven"
    directory: "/backend/movie-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "maven"
    directory: "/backend/watchlog-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "react", "react-dom"]
      tanstack:
        patterns: ["@tanstack/*"]

  - package-ecosystem: "docker"
    directory: "/backend/user-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend/movie-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend/watchlog-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
