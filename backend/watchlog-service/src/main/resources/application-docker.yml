spring:
  datasource:
    url: jdbc:mysql://mysql:3306/movietracker_watchlog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: redis
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: kafka:29092

app:
  clients:
    user-service-url: http://user-service:8081
    movie-service-url: http://movie-service:8082

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka

logging:
  level:
    root: INFO
