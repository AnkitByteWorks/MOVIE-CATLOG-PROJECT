spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/movietracker_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:movietracker}
    password: ${MYSQL_PASSWORD:movietracker}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      pool-name: user-service-pool
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.movietracker: DEBUG
