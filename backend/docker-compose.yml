  #     - "8080:8080"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: docker
  #     DB_URL: jdbc:mysql://mysql:3306/movietracker_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  #     DB_USER: ${MYSQL_USER}
