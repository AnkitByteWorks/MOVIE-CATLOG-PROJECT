  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - movietracker-net

volumes:
  mysql-data:
    name: movietracker-mysql-data
  redis-data:
    name: movietracker-redis-data
  kafka-data:
    name: movietracker-kafka-data
  mongo-data:
    name: movietracker-mongo-data
  redis-insight:
    name: movietracker-redis-insight
  prometheus-data:
    name: movietracker-prometheus-data
  grafana-data:
    name: movietracker-grafana-data

networks:
  movietracker-net:
    driver: bridge
    name: movietracker-net
